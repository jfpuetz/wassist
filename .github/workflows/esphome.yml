name: ESPHome

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ESPHome
        run: pip install -r requirements.txt

      - name: Firmware version
        id: ver
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Validate config
        run: esphome -s fw_version "${{ steps.ver.outputs.version }}" config esphome/wassist-node1.yaml

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: pio-${{ runner.os }}-${{ hashFiles('esphome/**/*.yaml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Compile firmware
        run: esphome -s fw_version "${{ steps.ver.outputs.version }}" compile esphome/wassist-node1.yaml

      # Webinstaller: Firmware + Manifest + Installationsseite zusammenstellen
      - name: Assemble web installer
        run: |
          set -euo pipefail
          FACTORY=$(find esphome/.esphome/build/wassist-node1 -name 'firmware.factory.bin' | head -n1)
          OTA=$(find esphome/.esphome/build/wassist-node1 -name 'firmware.ota.bin' | head -n1)
          test -n "$FACTORY" || { echo "firmware.factory.bin nicht gefunden"; exit 1; }
          test -n "$OTA" || { echo "firmware.ota.bin nicht gefunden"; exit 1; }
          mkdir -p site
          cp web/index.html site/
          cp "$FACTORY" site/wassist-node1.factory.bin
          cp "$OTA" site/wassist-node1.ota.bin
          VERSION="${{ steps.ver.outputs.version }}"
          MD5=$(md5sum site/wassist-node1.ota.bin | cut -d' ' -f1)
          SUMMARY=$(git log -1 --format=%s | tr -d '"\\' | sed 's/[&/|]/-/g' | cut -c1-120)
          sed -e "s|__VERSION__|${VERSION}|" -e "s|__MD5__|${MD5}|" \
              -e "s|__SUMMARY__|${SUMMARY}|" -e "s|__SHA__|${GITHUB_SHA}|" \
              web/manifest.json > site/manifest.json
          sed -i "s/__VERSION__/${VERSION}/" site/index.html
          python3 -m json.tool site/manifest.json
          ls -la site

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: wassist-node1-firmware
          path: site/*.bin

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
