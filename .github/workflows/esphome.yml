name: ESPHome

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ESPHome
        run: pip install esphome

      - name: Dummy secrets
        run: cp esphome/secrets.yaml.example esphome/secrets.yaml

      - name: Validate config
        run: esphome config esphome/wassist-node1.yaml

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esphome/.esphome
          key: pio-${{ runner.os }}-${{ hashFiles('esphome/**/*.yaml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Compile firmware
        run: esphome compile esphome/wassist-node1.yaml
