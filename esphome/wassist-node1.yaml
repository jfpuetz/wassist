# WAssist – Node 1
# Schaltplan: WASSIST-N1-E01…E04 (Rev. 01, 2026-09-20)
#
# Einstieg:   esphome run esphome/wassist-node1.yaml
# Nur prüfen: esphome config esphome/wassist-node1.yaml
#
# Ein zweiter Node ist eine Kopie dieser Datei mit anderen substitutions.

substitutions:
  node_name: wassist-node1
  friendly_name: WAssist Node 1
  # Firmware-Version: lokal "dev", der GitHub-Build setzt Datum + Commit (esphome -s fw_version ...)
  fw_version: dev
  update_manifest_url: https://jfpuetz.github.io/wassist/manifest.json

  # --- Pinbelegung (muss zu Blatt 3 / Anschlussliste passen) ---
  i2c_sda: GPIO8
  i2c_scl: GPIO9
  mic_bclk: GPIO4     # I2S0_BCLK  -> -U4 SCK
  mic_ws: GPIO5       # I2S0_WS    -> -U4 WS
  mic_sd: GPIO6       # I2S0_SD    <- -U4 SD
  amp_bclk: GPIO15    # I2S1_BCLK  -> -U3 BCLK
  amp_lrc: GPIO16     # I2S1_LRC   -> -U3 LRC
  amp_din: GPIO17     # I2S1_DIN   -> -U3 DIN
  led_pin: GPIO38     # LED_D_MCU  -> -R1 -> -STRIP1 DIN
  # Onboard-RGB-LED: GPIO48 (DevKitC-1 v1.0 / YD-ESP32-S3-Nachbau). Beim YD-Layout erst
  # nach Schließen der Lötbrücke "RGB" angeschlossen. Lötbrücke "IN-OUT" offen lassen.
  board_led_pin: GPIO48

  # --- LED-Streifen ---
  led_count: "100"
  # Harte Helligkeitsobergrenze (unabhängig von HA). Die LEDs sind nur dezente
  # Statusanzeige – 100 LEDs x 60 mA = 6 A bei Vollweiß wären weit mehr als nötig.
  led_cap_normal: "0.20"   # 20 % -> max. ca. 1,2 A, bei ausreichendem Netzteil
  led_cap_weak: "0.05"     #  5 % -> max. ca. 0,3 A, beim Start und bei schwachem Netzteil

  # --- USB-PD ---
  # Der Node fordert das Netzteil-Angebot mit der meisten Leistung an, höchstens pd_max_voltage.
  # Grenze durch die Bauteile: MP1584EN 28 V, INA219 26 V, -C8..-C11 35 V.
  # 12 V, bis die Spannungsfestigkeit von -C1/-C2 geprüft ist – bei >= 25 V auf 20V anheben.
  pd_max_voltage: 12V
  # Schwaches Netzteil = unter 9 V (Wandler laufen dann in Dropout) oder unter dieser Leistung.
  # Ein übliches 18-W-Netzteil (9 V / 2 A) gilt als ausreichend.
  pd_weak_below_w: "15"

  # --- INA219-Shunts (CJMCU-219 ab Werk 0,1 Ohm) ---
  ina_shunt_ohm: 0.1 ohm
  ina_max_current: 3.2A

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  project:
    name: jfpuetz.wassist
    version: ${fw_version}

packages:
  base: !include packages/base.yaml
  power: !include packages/power.yaml
  audio: !include packages/audio.yaml
  voice: !include packages/voice.yaml
  led: !include packages/led.yaml
