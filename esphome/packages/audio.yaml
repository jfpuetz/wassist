# Audio: zwei getrennte I2S-Busse.
#   I2S0 -> Mikrofon INMP441 (-U4), L/R an Masse = linker Kanal
#   I2S1 -> Verstärker MAX98357A (-U3), SD an VIN = linker Kanal, GAIN offen = 9 dB

i2s_audio:
  - id: i2s_mic_bus
    i2s_bclk_pin: ${mic_bclk}
    i2s_lrclk_pin: ${mic_ws}
  - id: i2s_amp_bus
    i2s_bclk_pin: ${amp_bclk}
    i2s_lrclk_pin: ${amp_lrc}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_sd}
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: amp
    i2s_audio_id: i2s_amp_bus
    i2s_dout_pin: ${amp_din}
    dac_type: external
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

# Soundtest: kurze Tonfolge über Verstärker und Lautsprecher
# ACHTUNG: rtttl setzt beim Abspielen die Lautsprecher-Lautstärke auf seinen eigenen "gain".
# Deshalb vor jedem Ton gain = Lautstärke-Regler und danach die Lautstärke wiederherstellen.
rtttl:
  id: beeper
  speaker: amp
  gain: 50%
  on_finished_playback:
    - script.execute: apply_volume

# --- Media Player ---
# Macht den Node in Home Assistant zum Lautsprecher: TTS (tts.speak), Durchsagen
# (assist_satellite.announce), Audiodateien/Streams (media_player.play_media).
# HA wandelt alles per ffmpeg in FLAC 16 kHz mono um. Eine Pipeline für alles (kein Mixer nötig).
# Der Media Player ist die einzige Stelle, die Lautstärke/Stumm hält und speichert.
media_player:
  - platform: speaker
    id: player
    name: Lautsprecher
    announcement_pipeline:
      speaker: amp
      format: FLAC
      num_channels: 1
      sample_rate: 16000
    task_stack_in_psram: true
    volume_initial: 50%
    volume_increment: 5%
    on_volume:
      # Regler in der Weboberfläche nachführen (Schutz gegen Schleifen)
      - lambda: |-
          const float pct = roundf(x * 100.0f);
          if (!id(volume).has_state() || fabsf(id(volume).state - pct) > 0.5f)
            id(volume).publish_state(pct);
    on_mute:
      - lambda: id(mute).publish_state(true);
    on_unmute:
      - lambda: id(mute).publish_state(false);

# --- Lautstärke ---
# Regler und Stumm-Schalter für die Weboberfläche; sie steuern den Media Player.
number:
  - platform: template
    id: volume
    name: Lautstärke
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: false
    initial_value: 50
    on_value:
      - if:
          condition:
            lambda: return fabsf(id(player).volume * 100.0f - x) > 0.5f;
          then:
            - media_player.volume_set:
                id: player
                volume: !lambda return x / 100.0f;

switch:
  - platform: template
    id: mute
    name: Stumm
    icon: mdi:volume-off
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - media_player.mute: player
    turn_off_action:
      - media_player.unmute: player

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(volume).publish_state(roundf(id(player).volume * 100.0f));
            id(mute).publish_state(id(player).is_muted());

# Physische Tasten: kurz = ±5 %, halten = wiederholen, beim Loslassen kurzer Piepton
binary_sensor:
  - platform: gpio
    id: btn_vol_up
    name: Taste Lauter
    entity_category: diagnostic
    pin:
      number: ${btn_vol_up_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - switch.turn_off: mute
      - while:
          condition:
            binary_sensor.is_on: btn_vol_up
          then:
            - number.increment:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

  - platform: gpio
    id: btn_vol_down
    name: Taste Leiser
    entity_category: diagnostic
    pin:
      number: ${btn_vol_down_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - while:
          condition:
            binary_sensor.is_on: btn_vol_down
          then:
            - number.decrement:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

script:
  # rtttl überschreibt die Speaker-Lautstärke -> danach die des Media Players wiederherstellen
  - id: apply_volume
    mode: restart
    then:
      - lambda: id(amp).set_volume(id(player).volume);

  - id: play_tone
    mode: restart
    parameters:
      song: string
    then:
      - lambda: id(beeper).set_gain(id(player).volume);
      - rtttl.play: !lambda return song;

  - id: volume_feedback
    mode: restart
    then:
      # Kein Piep, wenn gerade gesprochen oder abgespielt wird
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(echo).is_busy();
          then:
            - script.execute:
                id: play_tone
                song: "vol:d=16,o=6,b=200:c"

button:
  - platform: template
    name: Testton
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: play_tone
          song: "wassist:d=8,o=5,b=160:c,e,g,c6,4p,c6,g,e,4c"
