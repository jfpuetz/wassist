# Audio: zwei getrennte I2S-Busse.
#   I2S0 -> Mikrofon INMP441 (-U4), L/R an Masse = linker Kanal
#   I2S1 -> Verstärker MAX98357A (-U3), SD an VIN = linker Kanal, GAIN offen = 9 dB

i2s_audio:
  - id: i2s_mic_bus
    i2s_bclk_pin: ${mic_bclk}
    i2s_lrclk_pin: ${mic_ws}
  - id: i2s_amp_bus
    i2s_bclk_pin: ${amp_bclk}
    i2s_lrclk_pin: ${amp_lrc}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_sd}
    adc_type: external
    pdm: false
    channel: left
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: amp
    i2s_audio_id: i2s_amp_bus
    i2s_dout_pin: ${amp_din}
    dac_type: external
    channel: mono
    sample_rate: 16000
    bits_per_sample: 16bit

# Soundtest: kurze Tonfolge über Verstärker und Lautsprecher
rtttl:
  id: beeper
  speaker: amp
  gain: 50%

# --- Lautstärke ---
# Software-Lautstärke des I2S-Lautsprechers (dB-Kurve), gilt für Sprachausgabe, Testton und Echo-Test.
number:
  - platform: template
    id: volume
    name: Lautstärke
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 50
    on_value:
      - lambda: id(amp).set_volume(x / 100.0f);

switch:
  - platform: template
    id: mute
    name: Stumm
    icon: mdi:volume-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(amp).set_mute_state(true);
    turn_off_action:
      - lambda: id(amp).set_mute_state(false);

# Physische Tasten: kurz = ±5 %, halten = wiederholen, beim Loslassen kurzer Piepton
binary_sensor:
  - platform: gpio
    id: btn_vol_up
    name: Taste Lauter
    entity_category: diagnostic
    pin:
      number: ${btn_vol_up_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - switch.turn_off: mute
      - while:
          condition:
            binary_sensor.is_on: btn_vol_up
          then:
            - number.increment:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

  - platform: gpio
    id: btn_vol_down
    name: Taste Leiser
    entity_category: diagnostic
    pin:
      number: ${btn_vol_down_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - while:
          condition:
            binary_sensor.is_on: btn_vol_down
          then:
            - number.decrement:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

script:
  - id: volume_feedback
    mode: restart
    then:
      # Kein Piep, wenn gerade gesprochen oder abgespielt wird
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(echo).is_busy();
          then:
            - rtttl.play: "vol:d=16,o=6,b=200:c"

button:
  - platform: template
    name: Testton
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - rtttl.play: "wassist:d=8,o=5,b=160:c,e,g,c6,4p,c6,g,e,4c"
