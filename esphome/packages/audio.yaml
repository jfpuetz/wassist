# Audio: zwei getrennte I2S-Busse.
#   I2S0 -> Mikrofon INMP441 (-U4), L/R an Masse = linker Kanal
#   I2S1 -> Verstärker MAX98357A (-U3), SD an VIN = linker Kanal, GAIN offen = 9 dB
#
# Tonweg:  Media Player / Sprachantworten / Echo-Test  ->  amp (Resampler)  ->  amp_hw (I2S, 48 kHz)
# Der Resampler passt jede Quelle (16 kHz Echo, 48 kHz Media) an den festen I2S-Takt an.

i2s_audio:
  - id: i2s_mic_bus
    i2s_bclk_pin: ${mic_bclk}
    i2s_lrclk_pin: ${mic_ws}
  - id: i2s_amp_bus
    i2s_bclk_pin: ${amp_bclk}
    i2s_lrclk_pin: ${amp_lrc}

microphone:
  - platform: i2s_audio
    id: mic
    i2s_audio_id: i2s_mic_bus
    i2s_din_pin: ${mic_sd}
    adc_type: external
    pdm: false
    channel: ${mic_channel}
    bits_per_sample: 32bit
    sample_rate: 16000

speaker:
  - platform: i2s_audio
    id: amp_hw
    i2s_audio_id: i2s_amp_bus
    i2s_dout_pin: ${amp_din}
    dac_type: external
    channel: mono
    sample_rate: 48000
    bits_per_sample: 16bit
    buffer_duration: 100ms

  - platform: resampler
    id: amp
    output_speaker: amp_hw
    task_stack_in_psram: true

# --- Media Player ---
# Macht den Node in Home Assistant zum Lautsprecher: TTS (tts.speak), Durchsagen
# (assist_satellite.announce), Audiodateien/Streams (media_player.play_media).
# HA wandelt alles per ffmpeg in FLAC 48 kHz mono um. Eine Pipeline für alles (kein Mixer nötig).
# Der Media Player ist die einzige Stelle, die Lautstärke/Stumm hält und speichert.
media_player:
  - platform: speaker
    id: player
    name: Lautsprecher
    announcement_pipeline:
      speaker: amp
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    task_stack_in_psram: true
    volume_initial: 60%
    volume_increment: 5%
    # Software-Lautstärke regelt über 49 dB; ohne Untergrenze wäre schon 50 % = -25 dB.
    # 0..100 % in HA -> -24,5..0 dB am Lautsprecher (ganz aus = "Stumm").
    volume_min: 50%
    volume_max: 100%
    # Eingebaute Töne (WAV 48 kHz mono), laufen über den Media Player und damit mit dessen Lautstärke
    files:
      - id: snd_beep
        file: sounds/beep.wav
      - id: snd_test
        file: sounds/testton.wav
    on_volume:
      # Regler in der Weboberfläche nachführen (Schutz gegen Schleifen)
      - lambda: |-
          const float pct = roundf(x * 100.0f);
          if (!id(volume).has_state() || fabsf(id(volume).state - pct) > 0.5f)
            id(volume).publish_state(pct);
    on_mute:
      - lambda: id(mute).publish_state(true);
    on_unmute:
      - lambda: id(mute).publish_state(false);

# --- Lautstärke ---
# Regler und Stumm-Schalter für die Weboberfläche; sie steuern den Media Player.
number:
  - platform: template
    id: volume
    name: Lautstärke
    icon: mdi:volume-high
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    mode: slider
    optimistic: true
    restore_value: false
    initial_value: 60
    on_value:
      - if:
          condition:
            lambda: return fabsf(id(player).volume * 100.0f - x) > 0.5f;
          then:
            - media_player.volume_set:
                id: player
                volume: !lambda return x / 100.0f;

switch:
  - platform: template
    id: mute
    name: Stumm
    icon: mdi:volume-off
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - media_player.mute: player
    turn_off_action:
      - media_player.unmute: player

esphome:
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(volume).publish_state(roundf(id(player).volume * 100.0f));
            id(mute).publish_state(id(player).is_muted());

# Physische Tasten: kurz = ±5 %, halten = wiederholen, beim Loslassen kurzer Piepton
binary_sensor:
  - platform: gpio
    id: btn_vol_up
    name: Taste Lauter
    entity_category: diagnostic
    pin:
      number: ${btn_vol_up_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - switch.turn_off: mute
      - while:
          condition:
            binary_sensor.is_on: btn_vol_up
          then:
            - number.increment:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

  - platform: gpio
    id: btn_vol_down
    name: Taste Leiser
    entity_category: diagnostic
    pin:
      number: ${btn_vol_down_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 30ms
    on_press:
      - while:
          condition:
            binary_sensor.is_on: btn_vol_down
          then:
            - number.decrement:
                id: volume
                cycle: false
            - delay: 300ms
    on_release:
      - script.execute: volume_feedback

script:
  - id: volume_feedback
    mode: restart
    then:
      # Kurz warten, damit schnelles Mehrfachdrücken nur einen Piep auslöst;
      # kein Piep, während gesprochen oder etwas abgespielt wird
      - delay: 250ms
      - if:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - lambda: return !id(echo).is_busy();
              - media_player.is_idle: player
          then:
            - media_player.speaker.play_on_device_media_file:
                media_file: snd_beep
                announcement: true

button:
  - platform: template
    name: Testton
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - media_player.speaker.play_on_device_media_file:
          media_file: snd_test
          announcement: true
