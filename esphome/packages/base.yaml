# Grundsystem: Board, PSRAM, WLAN, API zu Home Assistant, OTA, Logging.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

# N16R8 = 8 MB Octal-PSRAM (belegt GPIO35/36/37 – nicht verwenden)
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${node_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome-Version
    entity_category: diagnostic

button:
  - platform: restart
    name: Neustart
    entity_category: config
