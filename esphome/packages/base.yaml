# Grundsystem: Board, PSRAM, WLAN, API zu Home Assistant, OTA, Logging.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

# N16R8 = 8 MB Octal-PSRAM (belegt GPIO35/36/37 – nicht verwenden)
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# --- Einrichtung ohne secrets.yaml (wie bei WLED) ---
# 1. Ohne gespeichertes WLAN öffnet der Node den Hotspot "${friendly_name} Setup".
#    Handy verbinden -> Einrichtungsseite öffnet sich (sonst http://192.168.4.1)
#    -> WLAN wählen, Passwort eingeben. Alternativ per USB über https://web.esphome.io (Improv).
# 2. Home Assistant findet den Node automatisch. Beim Hinzufügen erzeugt HA den
#    API-Schlüssel und überträgt ihn; danach sind nur noch verschlüsselte Verbindungen möglich.
# Zurücksetzen: Button "Werkseinstellungen" in HA (löscht WLAN und API-Schlüssel).

api:
  encryption: {}   # Schlüssel wird von Home Assistant bei der Einbindung gesetzt

ota:
  # Per WLAN aus ESPHome/CLI. Ohne Passwort: jedes Gerät im selben Netz könnte flashen.
  # Für mehr Schutz hier ein Passwort setzen (dann auch in HA/CLI verwenden).
  - platform: esphome
  # .bin-Datei manuell in der Weboberfläche hochladen
  - platform: web_server
  # Update aus dem GitHub-Release (siehe update: unten)
  - platform: http_request

# --- Firmware-Updates von GitHub ---
# Der Node prüft alle 6 h das Manifest auf GitHub Pages. Ist dort eine andere Version
# als die laufende, erscheint in HA und der Weboberfläche "Update verfügbar" mit Installieren-Button.
# Installiert wird nur auf Knopfdruck. Die Version setzt der GitHub-Build (fw_version).
http_request:
  verify_ssl: true
  timeout: 20s

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${update_manifest_url}
    update_interval: 6h

wifi:
  ap:
    ssid: "${friendly_name} Setup"
    # Hotspot erst öffnen, wenn das gespeicherte WLAN 30 s nicht erreichbar ist
    ap_timeout: 30s
  # WLAN-Energiesparen aus: stabilere Audio-Streams
  power_save_mode: none

captive_portal:

# Lokale Weboberfläche mit Live-Log: http://${node_name}.local
# Ohne Passwort – nur im eigenen (IoT-)Netz erreichbar.
web_server:
  port: 80
  version: 3
  log: true

improv_serial:

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome-Version
    entity_category: diagnostic
  # Eigene Firmware-Version (vom GitHub-Build gesetzt, lokal "dev")
  - platform: template
    name: Firmware installiert
    icon: mdi:chip
    entity_category: diagnostic
    update_interval: 60s
    lambda: return {ESPHOME_PROJECT_VERSION};
  # Neueste Version laut GitHub-Manifest (leer, bis die erste Prüfung durch ist)
  - platform: template
    id: fw_latest
    name: Firmware verfügbar
    icon: mdi:cloud-download
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      const auto &v = id(firmware_update).update_info.latest_version;
      if (v.empty())
        return {"noch nicht geprüft"};
      return v;

button:
  - platform: restart
    name: Neustart
    entity_category: config
  - platform: factory_reset
    name: Werkseinstellungen
    entity_category: config
