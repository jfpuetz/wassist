# Grundsystem: Board, PSRAM, WLAN, API zu Home Assistant, OTA, Logging.

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

# N16R8 = 8 MB Octal-PSRAM (belegt GPIO35/36/37 – nicht verwenden)
psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

# --- Einrichtung ohne secrets.yaml (wie bei WLED) ---
# 1. Ohne gespeichertes WLAN öffnet der Node den Hotspot "${friendly_name} Setup".
#    Handy verbinden -> Einrichtungsseite öffnet sich (sonst http://192.168.4.1)
#    -> WLAN wählen, Passwort eingeben. Alternativ per USB über https://web.esphome.io (Improv).
# 2. Home Assistant findet den Node automatisch. Beim Hinzufügen erzeugt HA den
#    API-Schlüssel und überträgt ihn; danach sind nur noch verschlüsselte Verbindungen möglich.
# Zurücksetzen: Button "Werkseinstellungen" in HA (löscht WLAN und API-Schlüssel).

api:
  encryption: {}   # Schlüssel wird von Home Assistant bei der Einbindung gesetzt

ota:
  - platform: esphome
    # Ohne Passwort: jedes Gerät im selben Netz könnte Firmware aufspielen.
    # Für mehr Schutz hier ein Passwort setzen (dann auch in HA/CLI verwenden).

wifi:
  ap:
    ssid: "${friendly_name} Setup"
    # Hotspot erst öffnen, wenn das gespeicherte WLAN 30 s nicht erreichbar ist
    ap_timeout: 30s
  # WLAN-Energiesparen aus: stabilere Audio-Streams
  power_save_mode: none

captive_portal:

improv_serial:

i2c:
  id: i2c_bus
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  frequency: 100kHz
  scan: true

sensor:
  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: Laufzeit
    entity_category: diagnostic

text_sensor:
  - platform: version
    name: ESPHome-Version
    entity_category: diagnostic

button:
  - platform: restart
    name: Neustart
    entity_category: config
  - platform: factory_reset
    name: Werkseinstellungen
    entity_category: config
