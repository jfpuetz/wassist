# Sprachassistent: lokales Wake Word auf dem ESP32-S3, danach Home Assistant Assist.

micro_wake_word:
  id: mww
  microphone:
    microphone: mic
    gain_factor: 4
  # Mehrere Modelle: in Home Assistant unter "Aktivierungswort" auswählbar.
  # Eigene Modelle später z. B. als lokale Datei: model: wake_words/hey_wassist.json
  models:
    - model: okay_nabu
      id: okay_nabu
    - model: hey_jarvis
      id: hey_jarvis
    - model: hey_mycroft
      id: hey_mycroft
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: echo_mode
        then:
          # Echo-Test: aufnehmen und wiedergeben statt an Home Assistant senden
          - script.execute: run_echo_test
        else:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

# Echo-Test (eigene Komponente): nimmt nach dem Wake Word auf und spielt es direkt wieder ab.
echo_test:
  id: echo
  microphone: mic
  speaker: amp
  duration: 5s
  gain_factor: 4
  # Leise Aufnahmen vor dem Abspielen anheben (Spitze auf ~ -3 dBFS, höchstens x16).
  # Pegel und Rauschen stehen im Log ("Peak ... RMS ... dBFS").
  normalize: true
  max_normalize_gain: 16
  on_record_start:
    - script.execute: led_listening
  on_playback_start:
    - script.execute: led_speaking
  on_finished:
    - script.execute: led_idle
    - if:
        condition:
          switch.is_on: wake_word_enabled
        then:
          - micro_wake_word.start:

script:
  - id: run_echo_test
    mode: single
    then:
      - micro_wake_word.stop:
      - wait_until:
          condition:
            not:
              micro_wake_word.is_running:
          timeout: 2s
      - echo_test.start: echo

voice_assistant:
  id: va
  # Verknüpfung, damit Home Assistant das Aktivierungswort auswählen kann
  micro_wake_word: mww
  microphone:
    microphone: mic
    gain_factor: 4
  # Antworten laufen über den Media Player (gleiche Lautstärke, HA-Durchsagen möglich)
  media_player: player
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.execute: led_listening
  on_stt_vad_end:
    - script.execute: led_thinking
  on_tts_start:
    - script.execute: led_speaking
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - script.execute: led_idle
    - micro_wake_word.start:
  on_error:
    - script.execute: led_error
  on_client_connected:
    - micro_wake_word.start:
    - script.execute: led_idle
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:
    - script.execute: led_error

button:
  - platform: template
    name: Echo-Test starten
    icon: mdi:record-rec
    entity_category: diagnostic
    on_press:
      - script.execute: run_echo_test

switch:
  - platform: template
    name: Echo-Test
    id: echo_mode
    icon: mdi:account-voice
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic

  - platform: template
    name: Wake Word aktiv
    id: wake_word_enabled
    icon: mdi:microphone
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - micro_wake_word.start:
    on_turn_off:
      - micro_wake_word.stop:
