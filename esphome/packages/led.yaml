# Status-LEDs: WS2812B-Streifen (-STRIP1) an GPIO38 über -R1.
# Hinweis: GPIO38 treibt auf DevKitC-1 v1.1 auch die Onboard-RGB-LED (spiegelt Pixel 1).

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    name: Status-LED
    pin: ${led_pin}
    num_leds: ${led_count}
    chipset: ws2812
    rgb_order: GRB
    # Harte Obergrenze, unabhängig von der Helligkeit in HA. Startwert = Sparmodus;
    # power.yaml hebt sie an, sobald das Netzteil genug Leistung liefert.
    color_correct:
      - ${led_cap_weak}
      - ${led_cap_weak}
      - ${led_cap_weak}
    default_transition_length: 200ms
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: Pulsieren
          transition_length: 600ms
          update_interval: 600ms
      - addressable_scan:
          name: Lauflicht
          move_interval: 20ms
          scan_width: 8

  # Diagnose: Onboard-RGB-LED des DevKit. Leuchtet sie, funktioniert die LED-Ansteuerung
  # der Firmware – bleibt nur der Streifen dunkel, liegt es an Leitung/Streifen.
  - platform: esp32_rmt_led_strip
    id: board_led
    name: Board-LED
    pin: ${board_led_pin}
    num_leds: 1
    chipset: ws2812
    rgb_order: GRB
    color_correct: [30%, 30%, 30%]
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic

script:
  - id: led_idle
    then:
      - light.turn_off: status_led
  - id: led_listening
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 0%
          green: 40%
          blue: 100%
          effect: Pulsieren
  - id: led_thinking
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 60%
          green: 0%
          blue: 100%
          effect: Lauflicht
  - id: led_speaking
    then:
      - light.turn_on:
          id: status_led
          brightness: 60%
          red: 0%
          green: 100%
          blue: 40%
          effect: none
  - id: led_error
    then:
      - light.turn_on:
          id: status_led
          brightness: 40%
          red: 100%
          green: 0%
          blue: 0%
          effect: none
      - delay: 2s
      - light.turn_off: status_led
